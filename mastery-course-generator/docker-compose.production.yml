services:
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_FILE: /app/data/mastery.db
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - klaxo-data:/app/data
      - klaxo-uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_FILE: /app/data/mastery.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - klaxo-data:/app/data
      - klaxo-uploads:/app/uploads

volumes:
  klaxo-data:
  klaxo-uploads:
